name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag matches application version
        shell: zsh {0}
        run: |
          set -euo pipefail
          app_version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw Info.plist)
          expected_tag="v${app_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            print -u2 "Tag $GITHUB_REF_NAME does not match application version $app_version"
            exit 1
          fi

      - name: Build and package release
        run: ./scripts/build-release.sh

      - name: Verify packaged application
        shell: zsh {0}
        run: |
          set -euo pipefail
          /usr/bin/lipo -archs dist/QuickNotes.app/Contents/MacOS/QuickNotes | /usr/bin/grep -qx arm64
          /usr/bin/codesign --verify --strict --verbose=2 dist/QuickNotes.app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/QuickNotes.zip
          --title "Quick Notes ${GITHUB_REF_NAME#v}"
          --generate-notes
